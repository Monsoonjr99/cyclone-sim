# Bespoke workflow for deploying both Cyclone Simulator Classic to monsoonjr99.github.io/cyclone-sim and
# Cyclone Simulator Alpha to monsoonjr99.github.io/cyclone-sim/alpha
name: Deploy Cyclone Simulator Classic and Alpha to Github Pages

on:
  # Runs on pushes targeting v0-primary (Classic) and v1-primary (Alpha)
  push:
    branches:
      - 'v0-primary'
      - 'v1-primary'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (Classic)
        uses: actions/checkout@v4
        with:
          ref: v0-primary
          path: classic
      - name: Checkout (Alpha)
        uses: actions/checkout@v4
        with:
          ref: v1-primary
          path: alpha
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build page for Classic
        run: |
          mkdir -p _site/dependencies
          mkdir _site/resources
          cd ./classic
          cp *.js ../_site/
          cp dependencies/* ../_site/dependencies/
          cp resources/* ../_site/resources/
          cp index.html ../_site/
          cp style.css ../_site/
          cp favicon.ico ../_site/
          cp changelog.txt ../_site/
      - name: Build page for Alpha
        run: |
          mkdir _site/alpha
          cd ./alpha
          npm ci
          npm run build
          cp dist/* ../_site/alpha/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
