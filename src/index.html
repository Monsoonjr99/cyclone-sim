<!DOCTYPE html>
<html>
  <head>
    <script type="module" src="./main.ts" defer></script>
    <link type="text/css" rel="stylesheet" href="./style.css" />
    <link type="image/x-icon" rel="shortcut icon" href="/favicon.ico" />
    <title>Cyclone Simulator Alpha</title>
  </head>
  <body>
    <canvas class="primary-canvas"></canvas>
    <div id="outer-ui-container" class="transparent-box">
      <div id="inner-ui-container" class="transparent-box anti-debug-console">
        <div class="panel collapsed">
          <button id="run-pause-button">Run</button>
          <button id="spawn-button">Spawn</button>
          <button id="debug-button">Debug Button</button>
          <a id="classic-link">Return to Cyclone Simulator Classic</a>
        </div>
        <div class="anti-panel transparent-box">
          <button id="toggle-panel-collapse">&gt;</button>
          <div id="clock"></div>
          <a class="version-str" href="./changelog.md">Cyclone Simulator </a>
        </div>
      </div>
      <div id="debug-tray" class="collapsed">
        <div class="cmd-line-box">
          <label for="debug-cmd-line">&gt;&nbsp;</label>
          <input type="text" id="debug-cmd-line" />
        </div>
        <div class="cmd-line-out">
          <ul></ul>
        </div>
      </div>
    </div>
  </body>
</html>
